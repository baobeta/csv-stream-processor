services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: csv
      POSTGRES_PASSWORD: csv
      POSTGRES_DB: csv_import
    ports:
      # 5544 to avoid clashing with a Postgres already running on 5432/5433
      - '5544:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U csv -d csv_import']
      interval: 2s
      retries: 15
